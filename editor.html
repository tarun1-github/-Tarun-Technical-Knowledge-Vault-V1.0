<script>
"use strict";let E=[],R=[],editing=null;let F={};try{F=JSON.parse(localStorage.getItem("tkv10-fav")||"{}");if(!F||typeof F!=="object")F={};}catch(_){F={};localStorage.removeItem("tkv10-fav");}const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(u,o){
  let r;
  try{
    r=await fetch(u,o);
  }catch(e){
    throw Error("Cannot reach Vault server. Make sure server.py is running on http://127.0.0.1:8000/.");
  }
  const text=await r.text();
  let j;
  try{j=JSON.parse(text)}catch(_){
    throw Error("Server returned non-JSON (HTTP "+r.status+"). Check/restart server.py.");
  }
  if(!r.ok||j.error)throw Error(j.error||("HTTP "+r.status));
  return j;
}

async function load(){
  try{
    const j=await api("/api/index?v=12.8.3-final");
    E=j.entries||[];
    $("status").textContent="Ready • "+E.length+" topics";
    $("mod").innerHTML='<option value="">All modules</option>'+
      [...new Set(E.map(e=>e.module))].sort().map(m=>"<option>"+esc(m)+"</option>").join("");
    render();
    const s=$("vaultServerStatus");
    if(s){s.textContent="Server: connected";s.style.color="#15803d";}
  }catch(e){
    $("status").textContent="Connection error";
    $("main").innerHTML='<div class="card"><b>Vault could not load.</b><p>'+esc(e.message)+'</p><button type="button" onclick="load()">🔄 Retry</button></div>';
    const s=$("vaultServerStatus");
    if(s){s.textContent="Server: error";s.style.color="#b91c1c";}
  }
}
function get(){
  const q=$("q").value.trim().toLowerCase(),m=$("mod").value,t=$("tag").value.trim().toLowerCase();
  return E.filter(e=>
    (!m||e.module===m)&&
    (!t||e.tags.join(" ").toLowerCase().includes(t))&&
    (!q||(e.title+" "+e.module+" "+e.tags.join(" ")+" "+e.text).toLowerCase().includes(q))
  );
}

function formatUpdatedAt(value){
  if(!value)return "Not saved yet";
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return String(value);
  return d.toLocaleString(undefined,{
    year:"numeric",month:"short",day:"2-digit",
    hour:"2-digit",minute:"2-digit",second:"2-digit"
  });
}
function updatedBadge(value){
  return '<div class="tkv-updated">🕒 Last modified: <b>'+esc(formatUpdatedAt(value))+'</b></div>';
}

document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openTopic(+b.dataset.open));
document.querySelectorAll("[data-rename]").forEach(b=>b.onclick=ev=>{ev.preventDefault();ev.stopPropagation();renameTopic(+b.dataset.rename)});
document.querySelectorAll("[data-delete-topic]").forEach(b=>b.onclick=ev=>{ev.preventDefault();ev.stopPropagation();deleteTopic(+b.dataset.deleteTopic)});
document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>fav(+b.dataset.fav))
}

function normalizeImageUrls(body,module,folder){
  const base="/files/"+encodeURIComponent(module)+"/topics/"+encodeURIComponent(folder)+"/attachments/";
  const box=document.createElement("div");
  box.innerHTML=body||"";
  box.querySelectorAll("img[src]").forEach(img=>{
    const s=(img.getAttribute("src")||"").trim();
    if(!s || s.startsWith("data:") || s.startsWith("http://") || s.startsWith("https://"))return;

    let name="";
    if(s.startsWith("/files/")){
      name=decodeURIComponent(s.split("/files/")[1]||"").split("/").pop();
    }else{
      name=s.replace(/^\.?\//,"");
      if(name.startsWith("attachments/"))name=name.slice("attachments/".length);
      name=name.split("/").pop();
    }

    if(name){
      img.setAttribute("src",base+name.split("/").map(encodeURIComponent).join("/"));
      img.dataset.tkvFile="attachments/"+name;
    }
  });
  return box.innerHTML;
}

async function checkVaultServer(){
  const s=$("vaultServerStatus");
  if(!s)return;
  try{
    const r=await fetch("/api/index",{cache:"no-store"});
    if(r.ok){s.textContent="Server: connected";s.style.color="#15803d";}
    else{s.textContent="Server: HTTP "+r.status;s.style.color="#b91c1c";}
  }catch(_){s.textContent="Server: offline";s.style.color="#b91c1c";}
}
function wireBackupVault(){
  const b=$("backupVault");
  if(!b)return;
  b.onclick=async()=>{
    b.disabled=true; b.textContent="⏳ Backing up...";
    try{
      const j=await api("/api/backup",{method:"POST"});
      alert("Vault backup created successfully.\n\n"+j.file+"\n\nYour documentation and attachments are included.");
    }catch(e){alert("Backup failed:\n\n"+e.message)}
    finally{b.disabled=false;b.textContent="💾 Backup Vault";}
  };
}
async function openTopic(i){try{let e=R[i];if(!e)return alert("Topic could not be identified.");let r=await fetch("/api/topic?path="+encodeURIComponent(e.path),{cache:"no-store"});let txt=await r.text();let j;try{j=JSON.parse(txt)}catch(_){throw new Error("Server returned a non-JSON response (HTTP "+r.status+"). Restart the V12.1 server.")}if(!r.ok||j.error){
  // Recover once from a stale client index after module/topic moves.

}
if(!r.ok||j.error)throw new Error(j.error||("HTTP "+r.status));
const existingFolder=e.path.split("/topics/")[1].split("/")[0];
editing={...e,folder:existingFolder,originalModule:e.module};
showEditor({title:e.title,module:e.module,tags:(e.tags||[]).join(","),folder:existingFolder,updated_at:e.updated_at,body:normalizeImageUrls(j.html||"<p></p>",e.module,existingFolder)})}catch(err){alert("Open / Edit failed:\n\n"+err.message)}}
function setupEditorSideTools(){
  const aside=document.querySelector(".layout>aside");
  const toolbar=document.querySelector("#main .toolbar");
  if(!aside||!toolbar)return;

  const old=aside.querySelector(".tkv-editor-tools");

    '<div class="tkv-primary-tools" id="tkvPrimaryTools"></div>'+

    '<div class="tkv-format-label">Formatting & Documentation</div>'+
    '<div id="tkvOtherTools"></div>';
  aside.appendChild(wrap);

  const primary=document.getElementById("tkvPrimaryTools");
  const format=document.getElementById("tkvFormatTools");
  const other=document.getElementById("tkvOtherTools");

  ["command","code","diagram","imageBtn","fileBtn"].forEach(id=>{
    const el=document.getElementById(id);
    if(el){
      el.setAttribute("type","button");
      primary.appendChild(el);
    }
  });

  ["fontName","fontSize"].forEach(id=>{
    const el=document.getElementById(id);
    if(el)format.appendChild(el);
  });

  [...toolbar.children].forEach(el=>{
    if(el.id && ["command","code","diagram","imageBtn","fileBtn","fontName","fontSize"].includes(el.id))return;
    other.appendChild(el);
  });
  toolbar.remove();

  // Re-wire the five primary controls after relocation. These call the
  // existing dialogs/file inputs; no new storage logic is introduced.
  primary.addEventListener("click",(ev)=>{
    const b=ev.target.closest("button");
    if(!b)return;
    ev.preventDefault();
    ev.stopPropagation();

    switch(b.id){
      case "command": commandDialog(); break;
      case "code": codeDialog(); break;
      case "diagram": diagramDialog(); break;
      case "imageBtn": document.getElementById("image")?.click(); break;
      case "fileBtn": document.getElementById("files")?.click(); break;
    }
  });

  if(drop){
    drop.title="Click to choose an attachment, or drag/drop a file here";
    drop.onclick=(ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      saveEditorRange();
      document.getElementById("files")?.click();
    };
  }
}

function cleanEditorSpacing(){
  const editor=$("editor");
  if(!editor)return;
  [...editor.children].forEach(el=>{
    if(el.tagName==="P" && !el.textContent.trim() &&
       el.innerHTML.replace(/<br\s*\/?>/gi,"").trim()===""){
      const prev=el.previousElementSibling;
      if(prev && prev.matches(".codebox,.commandbox,.diagram,.callout")) el.remove();
    }
  });
  while(editor.lastElementChild &&
        editor.lastElementChild.tagName==="P" &&
        !editor.lastElementChild.textContent.trim() &&
        editor.lastElementChild.innerHTML.replace(/<br\s*\/?>/gi,"").trim()===""){
    editor.lastElementChild.remove();
  }

function highlightCode(source){
  // SECURITY/CORRECTNESS RULE:
  // source is always treated as plain text. Escape happens per text token
  // before it is inserted into HTML. Never regex-match generated markup.
  const text=String(source??"");
  const escText=(v)=>String(v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
  const token=/#[^\r\n]*|\/\/[^\r\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b\d+(?:\.\d+)*\b|[A-Za-z_][A-Za-z0-9_-]*/g;
  const kw=/^(def|class|import|from|return|if|else|elif|for|while|try|except|finally|with|as|in|True|False|None|function|const|let|var|SELECT|FROM|WHERE|INSERT|UPDATE|DELETE|CREATE|DROP|BEGIN|END|Get-[A-Za-z]+|Set-[A-Za-z]+|New-[A-Za-z]+|Invoke-[A-Za-z]+|Test-[A-Za-z]+|docker|git|kubectl|ls|cd|pwd|grep|awk|sed|cat|tail|head|chmod|chown|systemctl|show|configure|exit)$/i;
  let html="",pos=0,m;
  while((m=token.exec(text))){
    html+=escText(text.slice(pos,m.index));
    const t=m[0];
    if(t[0]==="#"||t.startsWith("//")) html+='<span class="comment">'+escText(t)+'</span>';
    else if(t[0]==='"'||t[0]==="'") html+='<span class="str">'+escText(t)+'</span>';
    else if(/^\d/.test(t)) html+='<span class="num">'+escText(t)+'</span>';
    else if(kw.test(t)) html+='<span class="kw">'+escText(t)+'</span>';
    else html+=escText(t);
    pos=token.lastIndex;
  }
  return html+escText(text.slice(pos));
}

  const actualIsImage=f.type.startsWith("image/");
  if(isImage && !actualIsImage){
    return alert("This control accepts images only. Use 📎 Attachment for PDF, DOCX, XLSX, ZIP, TXT and other files.");
  }
  if(!editing){
    pendingFiles.push({file:f,isImage:actualIsImage});
    alert("File queued. Save the topic first; it will be uploaded automatically. You can queue multiple files.");
    return;
  }
  const data=await new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=rej;
    r.readAsDataURL(f);
  });
  try{
    const j=await api("/api/upload",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        module:$("module").value,
        folder:editing.folder,
        name:f.name,
        mime:f.type||"application/octet-stream",
        data
      })
    });
    if(actualIsImage){
      const imageUrl="/files/"+String(j.relative||"").replace(/^\/+/,"").split("/").map(encodeURIComponent).join("/");
      cmd("insertHTML",'<p class="media-item"><img src="'+imageUrl+'" data-tkv-file="'+esc(j.relative)+'" alt="'+esc(f.name)+'" title="'+esc(f.name)+'"></p>');
    }else{
      const icon=fileIcon(f.name);
      cmd("insertHTML",'<p class="media-item"><span>'+icon+' </span><a href="'+j.url+'" data-tkv-file="'+esc(j.relative)+'" data-tkv-attachment="true" target="_blank" rel="noopener" download="'+esc(f.name)+'">'+esc(f.name)+'</a> <small>('+esc(f.type||"file")+')</small></p>');
    }
    await loadAttachments();
  }catch(err){
    alert("Upload failed: "+err.message);
  }
}
function fileIcon(name){
  const x=name.toLowerCase();
  if(x.endsWith(".pdf"))return "📕";
  if(/\.(doc|docx)$/.test(x))return "📘";
  if(/\.(xls|xlsx|csv)$/.test(x))return "📗";
  if(/\.(ppt|pptx)$/.test(x))return "📙";
  if(/\.(zip|7z|rar|tar|gz)$/.test(x))return "🗜️";
  if(/\.(txt|md|log)$/.test(x))return "📄";
  return "📎";
}


function repairVaultImages(root){
  if(!root || !editing)return;
  const base="/files/"+encodeURIComponent(editing.module)+"/topics/"+encodeURIComponent(editing.folder)+"/attachments/";
  root.querySelectorAll("img").forEach(img=>{
    let rel=img.dataset.tkvFile||"";
    const src=img.getAttribute("src")||"";

    if(!rel && src){
      const name=src.includes("/files/")
        ? decodeURIComponent(src.split("/files/")[1]||"").split("/").pop()
        : src.replace(/^\.?\//,"").replace(/^attachments\//,"").split("/").pop();
      if(name)rel="attachments/"+name;
    }

    if(rel){
      const name=decodeURIComponent(rel.split("/").pop());
      if(name){
        const expected=base+name.split("/").map(encodeURIComponent).join("/");
        img.dataset.tkvFile="attachments/"+name;
        img.setAttribute("src",expected);
      }
    }
  });
}

async function save(){
  cleanEditorSpacing();
  const title=$("title").value.trim(),module=$("module").value.trim();
  if(!title||!module)return alert("Title and module are required.");
  $("saveStatus").textContent="Saving...";

  const payload={
    title,module,
    tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean),
    content:$("editor").innerHTML,
    format:$("format").value,
    folder:editing?editing.folder:null,
    original_module:editing?editing.originalModule:null
  };

  try{
    const j=await api("/api/save",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    $("saveStatus").textContent=(j.updated?"Updated existing topic":"Created new topic")+" • "+j.topics+" topics indexed"+
      (j.warning?" • ⚠️ history warning":"");

    if(j.warning){
      console.warn("Vault save warning:",j.warning);
    }

    if(pendingFiles.length){
      const qfiles=[...pendingFiles]; pendingFiles=[];
      editing={...(editing||{}),folder:j.folder,module:j.module,originalModule:j.module};
      for(const q of qfiles)await uploadFile(q.file,q.isImage);
    }

    // Keep the edit context current so a second Save continues to update
    // the same topic rather than accidentally creating a new one.
    editing={...(editing||{}),folder:j.folder,module:j.module,originalModule:j.module,updated_at:j.updated_at};
    await load();
    // Return to the same topic after reload when possible.
    const found=E.find(x=>x.path===j.module+"/topics/"+j.folder+"/entry.html");
    if(found){
      const idx=E.indexOf(found);
      // Don't force the editor open; just keep the saved timestamp/state.
    }
  }catch(e){
    $("saveStatus").textContent="Save error";
    let detail=e.message;

    // If the connection dropped after the server wrote the file, check the
    // fresh index before reporting a hard failure.
    try{
      const fresh=await api("/api/index");
      const hit=(fresh.entries||[]).find(x=>x.path===((module+"/topics/"+(editing?editing.folder:"")+"/entry.html").replace(/\/+/g,"/")));
      if(hit && hit.title===title){
        $("saveStatus").textContent="Saved • server confirmed";
        editing={...(editing||{}),folder:(editing?editing.folder:null),module:hit.module,originalModule:hit.module,updated_at:hit.updated_at};
        await load();
        return;
      }
    }catch(_){}

    alert("Save failed:\n\n"+detail+"\n\nYour current editor content has NOT been cleared.");
  }
}

function insertNewLine(){
  restoreEditorRange();
  const editor=$("editor");
  if(!editor)return;
  let r=window._tkvRange;
  if(!r || !editor.contains(r.commonAncestorContainer)){
    editor.focus(); r=document.createRange();
    r.selectNodeContents(editor); r.collapse(false);
  }
  let node=r.startContainer;
  if(node.nodeType===3)node=node.parentElement;
  const special=node&&node.closest?node.closest(".codebox,.commandbox,.diagram,.callout"):null;
  if(special && editor.contains(special)){
    let p=special.nextElementSibling;
    if(!p || p.tagName!=="P"){
      p=document.createElement("p"); p.innerHTML="<br>";
      special.parentNode.insertBefore(p,special.nextSibling);
    }
    const nr=document.createRange(); nr.selectNodeContents(p); nr.collapse(true);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(nr);
    window._tkvRange=nr.cloneRange(); editor.focus(); return;
  }
  r.deleteContents();
  const p=document.createElement("p"); p.innerHTML="<br>"; r.insertNode(p);
  const nr=document.createRange(); nr.setStart(p,0); nr.collapse(true);
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(nr);
  window._tkvRange=nr.cloneRange(); editor.focus();
}

async function deleteTopic(i){
  const e=R[i]; if(!e)return;
  if(!confirm('⚠️ DELETE TOPIC?\\n\\n"'+e.title+'"\\n\\nThis deletes the topic, attachments and history.\\n\\nThis cannot be undone.'))return;

  // Remove it from the visible UI immediately.
  const deletedId=e.id;
  E=E.filter(x=>x.id!==deletedId);
  R=get();
  if(F[deletedId]){
    delete F[deletedId];
    localStorage.setItem("tkv10-fav",JSON.stringify(F));
  }
  render();

  try{
    const r=await fetch("/api/delete-topic?path="+encodeURIComponent(e.path)+"&id="+encodeURIComponent(e.id),{
      method:"DELETE",cache:"no-store"
    });
    const text=await r.text();
    let j=null;
    try{j=JSON.parse(text)}catch(_){}

    if(!r.ok || !j || j.error){
      // Re-read the real Vault state. If the topic is already gone, deletion
      // succeeded even if the browser lost the HTTP response.
      await load();
      const stillExists=E.some(x=>x.id===deletedId);
      if(!stillExists)return;
      throw new Error((j&&j.error)||("HTTP "+r.status));
    }

    E=j.entries||[];
    render();
  }catch(err){
    // A network error can happen after the server has already deleted the
    // folder. Verify before showing any failure message.
    try{
      await load();
      const stillExists=E.some(x=>x.id===deletedId);
      if(!stillExists)return;
    }catch(_){}
    alert("Delete topic failed:\n\n"+err.message);
  }
}
async function renameModule(){

  if(!newModule||newModule===module)return;
  if(!/^[^<>:"/\\|?*]+$/.test(newModule)){
    return alert("Invalid module name. Avoid: < > : \" / \\ | ? *");
  }

  try{
    const j=await api("/api/rename-module",{

    });

}
