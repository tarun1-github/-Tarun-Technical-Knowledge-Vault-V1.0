<!doctype html><html><head><meta charset="utf-8"><title>3. Override CMD</title><meta name="vault-tags" content="docker,imported"><style>body{font-family:system-ui;max-width:1000px;margin:36px auto;padding:0 24px;line-height:1.62;color:#17202a}h1{font-size:30px}h2{margin-top:28px}pre{background:#111827;color:#f8fafc;padding:14px;border-radius:9px;overflow:auto}.callout{padding:12px 14px;border-left:5px solid #64748b;background:#f8fafc;margin:12px 0}.blue{border-color:#2563eb}.green{border-color:#16a34a}.yellow{border-color:#ca8a04}.red{border-color:#dc2626}.purple{border-color:#9333ea}.orange{border-color:#ea580c}.tag{display:inline-block;padding:3px 9px;border-radius:14px;background:#e8eef7;margin:2px;font-size:12px}</style></head><body><h1>3. Override CMD</h1><div><span class="tag">docker</span> <span class="tag">imported</span></div><p>3. Override CMD</p>
<p>dockerfile</p>
<p>FROM ubuntu</p>
<p>CMD [&quot;sleep&quot;, &quot;5&quot;]</p>
<pre><code>docker run ubuntu-sleeper</code></pre>
<p>But you can override the CMD: docker run ubuntu-sleeper sleep 10</p>
<p>Dockerfile CMD :: The Dockerfile hasn&#x27;t changed.</p>
<p>sleep 5</p>
<p>   ↓</p>
<p>OVERRIDDEN</p>
<p>   ↓</p>
<p>sleep 10</p></body></html>
